<!DOCTYPE html>
<html>
<head>
    <title>Sparta Bot (Authenticated)</title>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        #webchat { height: 100%; width: 100%; }
    </style>
    <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
</head>
<body>
    <div id="webchat" role="main"></div>

    <script>
        (async function () {
            // 1. This is the URL you provided (The Token Endpoint)
            // Note: I modified it slightly to point to the 'generate' endpoint which is standard for tokens
            const tokenEndpointURL = "https://f10a9e129913ef499e63967deabb22.0b.environment.api.powerplatform.com/powervirtualagents/botsbyschema/copilots_header_bb722/directline/token?api-version=2022-03-01-preview";

            try {
                // 2. Fetch the secure token from Microsoft
                const response = await fetch(tokenEndpointURL);
                if (!response.ok) {
                    throw new Error("Failed to get token: " + response.statusText);
                }
                const { token } = await response.json();

                // 3. Render the Web Chat with the token
                window.WebChat.renderWebChat(
                    { 
                        directLine: window.WebChat.createDirectLine({ token }),
                        userID: "Keith Villanueva", // Optional: You can hardcode or pass this dynamically
                        username: "Keith" 
                    },
                    document.getElementById('webchat')
                );

                // 4. Auto-focus the typing box
                document.querySelector('[data-id="webchat-sendbox-input"]').focus();

            } catch (err) {
                console.error(err);
                document.getElementById("webchat").innerText = "Error connecting to Sparta Bot. Check console.";
            }
        })();
    </script>
</body>
</html>
